<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#172e30"><title>DAWNRISE — Browser Prototype</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b1d;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated;touch-action:none}#hint{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);font-size:11px;color:#e3e5cc;pointer-events:none;text-shadow:1px 2px #0008;white-space:nowrap}#rotate{display:none;position:absolute;inset:0;background:#102327eb;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20;font-size:20px}#upgrade{display:none;position:absolute;inset:0;background:#07151bbd;align-items:center;justify-content:center;z-index:10;padding:14px}#panel{width:min(760px,96vw);background:#20354b;border:3px solid #d7b66d;border-radius:12px;padding:12px;box-shadow:0 12px 35px #000b;text-align:center}h2{margin:0 0 9px;color:#ffe4a0;font-size:clamp(18px,3.5vw,28px)}#cards{display:flex;gap:10px;justify-content:center}.card{flex:1;min-width:0;min-height:112px;background:#2b4057;border:2px solid #7195af;border-radius:9px;color:white;padding:9px 4px;font-size:clamp(12px,2.2vw,17px);touch-action:manipulation}.card strong{display:block;color:#ffdf8a;margin-bottom:8px}.card small{display:block;font-size:clamp(10px,1.7vw,13px);line-height:1.3}.card:focus,.card.selected{outline:3px solid #ffe27b}#panel p{font-size:12px;margin:8px 0 0;color:#cbd9df}#buttons{position:absolute;top:7px;right:10px;display:flex;gap:7px;z-index:3}#buttons button{border:1px solid #e3d2a4;background:#1d3543de;color:white;border-radius:8px;padding:8px 11px;font-size:12px;touch-action:manipulation}@media(orientation:portrait){#rotate{display:flex}#upgrade{display:none!important}}</style></head><body><canvas id="game"></canvas><div id="buttons"><button id="weapon">⚔ Sword</button><button id="pause">Ⅱ Pause</button></div><div id="upgrade"><div id="panel"><h2>LEVEL UP! — Choose an Upgrade</h2><div id="cards"><button class="card" data-i="0"><strong>⚔ POWER</strong><small>+7 weapon damage</small></button><button class="card" data-i="1"><strong>⚡ HASTE</strong><small>Attack 16% faster</small></button><button class="card" data-i="2"><strong>♥ VITALITY</strong><small>+25 maximum HP and heal</small></button></div><p>Tap any card · Xbox D-pad to choose · A to confirm</p></div></div><div id="rotate">🌅 Rotate your phone to landscape to play DAWNRISE</div><div id="hint">Move: left stick / touch joystick · Switch: Xbox X / weapon button</div><script>
'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d');let W=960,H=540,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(innerWidth*dpr);c.height=Math.round(innerHeight*dpr);W=innerWidth;H=innerHeight;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const saveKey='dawnrise_browser_01';let stored={};try{stored=JSON.parse(localStorage.getItem(saveKey)||'{}')}catch(e){}
const p={x:0,y:0,hp:100,maxHp:100,level:1,xp:0,kills:0,damage:22,rate:0.72,weapon:0,dir:1,invuln:0};let enemies=[],shots=[],particles=[],worldTime=0,spawnClock=0,attackClock=0,paused=false,leveling=false,choice=0,gameOver=false,joyId=null,joyStart=null,joyVec={x:0,y:0},keys={},prevButtons={},flash=0;
const weapons=['Sword','Bow','Wand'];const weaponBtn=document.getElementById('weapon');const upgrade=document.getElementById('upgrade');const cards=[...document.querySelectorAll('.card')];
function persist(){try{localStorage.setItem(saveKey,JSON.stringify({bestKills:Math.max(stored.bestKills||0,p.kills),bestLevel:Math.max(stored.bestLevel||1,p.level)}))}catch(e){}}
function switchWeapon(){if(leveling||gameOver)return;p.weapon=(p.weapon+1)%3;weaponBtn.textContent=['⚔ Sword','🏹 Bow','✦ Wand'][p.weapon]}
weaponBtn.addEventListener('click',switchWeapon);document.getElementById('pause').onclick=()=>{if(!leveling&&!gameOver){paused=!paused;document.getElementById('pause').textContent=paused?'▶ Resume':'Ⅱ Pause'}};
function showUpgrade(){leveling=true;choice=0;upgrade.style.display='flex';cards.forEach((b,i)=>b.classList.toggle('selected',i===choice))}
function chooseUpgrade(i){if(!leveling)return;if(i===0)p.damage+=7;if(i===1)p.rate=Math.max(.18,p.rate*.84);if(i===2){p.maxHp+=25;p.hp=Math.min(p.maxHp,p.hp+35)}leveling=false;upgrade.style.display='none';persist()}
cards.forEach((b,i)=>b.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();chooseUpgrade(i)}));
function inputVector(){let x=joyVec.x,y=joyVec.y;if(keys.ArrowLeft||keys.a)x-=1;if(keys.ArrowRight||keys.d)x+=1;if(keys.ArrowUp||keys.w)y-=1;if(keys.ArrowDown||keys.s)y+=1;let gp=navigator.getGamepads?.().find(Boolean);if(gp){const ax=gp.axes[0]||0,ay=gp.axes[1]||0;if(Math.hypot(ax,ay)>.19){x=ax;y=ay}}let m=Math.hypot(x,y);return m>1?{x:x/m,y:y/m}:{x,y}}
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='x'||e.key==='X')switchWeapon();if(leveling){if(e.key==='1'||e.key==='2'||e.key==='3')chooseUpgrade(+e.key-1);if(e.key==='Enter')chooseUpgrade(choice);if(e.key==='ArrowLeft'||e.key==='ArrowRight'){choice=(choice+(e.key==='ArrowLeft'?2:1))%3;cards.forEach((b,i)=>b.classList.toggle('selected',i===choice))}}});addEventListener('keyup',e=>keys[e.key]=false);
function joystickCenter(){return {x:Math.max(85,W*.11),y:H-96}}function touchUpdate(x,y){let j=joyStart||joystickCenter(),dx=x-j.x,dy=y-j.y,m=Math.hypot(dx,dy),r=55;joyVec={x:dx/Math.max(m,r),y:dy/Math.max(m,r)}}
c.addEventListener('pointerdown',e=>{e.preventDefault();if(leveling||gameOver)return;const j=joystickCenter();if(e.clientX<W*.44||Math.hypot(e.clientX-j.x,e.clientY-j.y)<115){joyId=e.pointerId;joyStart=j;touchUpdate(e.clientX,e.clientY);c.setPointerCapture(e.pointerId)}});c.addEventListener('pointermove',e=>{if(e.pointerId===joyId)touchUpdate(e.clientX,e.clientY)});function release(e){if(e.pointerId===joyId){joyId=null;joyVec={x:0,y:0};joyStart=null}}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);
function rnd(a,b){return a+Math.random()*(b-a)}function hash(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function circle(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function spawn(){let a=Math.random()*Math.PI*2,r=rnd(440,690),type=Math.random()<.22?1:0;enemies.push({x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r,hp:type?85:48,max:type?85:48,speed:type?42:68,type,hit:0})}
function particle(x,y,col,count=6){for(let i=0;i<count;i++)particles.push({x,y,vx:rnd(-85,85),vy:rnd(-85,85),t:rnd(.25,.55),col})}
function hurtEnemy(e,d){e.hp-=d;e.hit=.13;particle(e.x,e.y,e.type?'#b1dc75':'#e8c55e',3);if(e.hp<=0){p.kills++;p.xp+=e.type?4:2;particle(e.x,e.y,'#6fe9f6',10);e.dead=true;if(p.xp>=p.level*12){p.xp-=p.level*12;p.level++;showUpgrade()}}}
function attack(){let target=null,dist=Infinity;for(let e of enemies){let d=Math.hypot(e.x-p.x,e.y-p.y);if(d<dist){dist=d;target=e}}if(!target)return;if(p.weapon===0){if(dist<105){hurtEnemy(target,p.damage);shots.push({x:p.x,y:p.y,life:.2,kind:'slash',dir:Math.atan2(target.y-p.y,target.x-p.x)})}}else if(dist<390){let a=Math.atan2(target.y-p.y,target.x-p.x);shots.push({x:p.x,y:p.y,vx:Math.cos(a)*(p.weapon===1?470:340),vy:Math.sin(a)*(p.weapon===1?470:340),life:1.3,kind:p.weapon===1?'arrow':'magic',damage:p.damage*(p.weapon===1?1.15:.9)})}}
function padButton(g,i){return !!g.buttons[i]?.pressed}function padPress(g,i){let v=padButton(g,i),old=prevButtons[i]||false;prevButtons[i]=v;return v&&!old}
function gamepadPoll(){let g=navigator.getGamepads?.().find(Boolean);if(!g)return;if(padPress(g,2))switchWeapon();if(leveling){if(padPress(g,14))choice=0;if(padPress(g,12))choice=1;if(padPress(g,15))choice=2;cards.forEach((b,i)=>b.classList.toggle('selected',i===choice));if(padPress(g,0))chooseUpgrade(choice)}else{for(let i of [0,12,14,15])prevButtons[i]=padButton(g,i)}}
function restart(){Object.assign(p,{x:0,y:0,hp:100,maxHp:100,level:1,xp:0,kills:0,damage:22,rate:.72,weapon:0,invuln:0});enemies=[];shots=[];particles=[];worldTime=0;gameOver=false;paused=false;leveling=false;weaponBtn.textContent='⚔ Sword'}
function update(dt){gamepadPoll();if(paused||leveling||gameOver)return;worldTime+=dt;let v=inputVector(),speed=210;p.x+=v.x*speed*dt;p.y+=v.y*speed*dt;if(v.x)p.dir=Math.sign(v.x);p.invuln=Math.max(0,p.invuln-dt);spawnClock-=dt;if(spawnClock<=0){spawnClock=Math.max(.27,1.05-worldTime*.004);spawn();if(worldTime>45&&Math.random()<.3)spawn()}attackClock-=dt;if(attackClock<=0){attackClock=p.rate;attack()}for(let e of enemies){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;e.hit=Math.max(0,e.hit-dt);if(d<25&&p.invuln===0){p.hp-=e.type?16:9;p.invuln=.65;flash=.2;if(p.hp<=0){p.hp=0;gameOver=true;persist()}}}enemies=enemies.filter(e=>!e.dead&&Math.hypot(e.x-p.x,e.y-p.y)<1200);for(let s of shots){s.life-=dt;if(s.kind==='slash')continue;s.x+=s.vx*dt;s.y+=s.vy*dt;for(let e of enemies){if(!e.dead&&Math.hypot(e.x-s.x,e.y-s.y)<(e.type?25:19)){hurtEnemy(e,s.damage);s.life=0;break}}}shots=shots.filter(s=>s.life>0);for(let q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt}particles=particles.filter(q=>q.t>0);flash=Math.max(0,flash-dt)}
function drawTree(x,y,s){circle(x+2,y+9,12*s,'#314b29');rect(x-4*s,y-4*s,8*s,21*s,'#745b39');circle(x,y-14*s,19*s,'#246b3c');circle(x-9*s,y-22*s,12*s,'#35884c');circle(x+10*s,y-22*s,12*s,'#2c7541')}
function drawWorld(){let ox=W/2-p.x,oy=H/2-p.y;ctx.fillStyle='#829d68';ctx.fillRect(0,0,W,H);let tile=64,x0=Math.floor((p.x-W/2)/tile)-1,x1=Math.ceil((p.x+W/2)/tile)+1,y0=Math.floor((p.y-H/2)/tile)-1,y1=Math.ceil((p.y+H/2)/tile)+1;for(let tx=x0;tx<=x1;tx++)for(let ty=y0;ty<=y1;ty++){let x=tx*tile+ox,y=ty*tile+oy,n=hash(tx,ty);rect(x,y,tile+1,tile+1,n>.79?'#91a878':n>.5?'#839e6b':'#78945f');if(Math.abs(ty*tile+30)<88){rect(x,y,tile+1,tile+1,(tx+ty)%2?'#aa9f81':'#b8a98b');rect(x+3,y+4,58,1,'#9b9077')}else if(n>.89){rect(x+11,y+36,6,4,'#627d50');rect(x+39,y+12,4,4,'#bdd67e')}if(n>.945&&Math.abs(ty*tile)>110)drawTree(x+32,y+38,.9);else if(n<.04&&Math.abs(ty*tile)>130){circle(x+30,y+32,12,'#637b6c');circle(x+25,y+28,9,'#82948a')}}
// Ruined watchtower near the start, for an exploration landmark.
let lx=700+ox,ly=-260+oy;if(lx>-100&&lx<W+100&&ly>-100&&ly<H+100){rect(lx-55,ly-30,110,75,'#776e65');rect(lx-50,ly-24,100,61,'#a59b87');rect(lx-55,ly-37,25,27,'#6b6b69');rect(lx+30,ly-37,25,27,'#6b6b69');rect(lx-13,ly+4,27,41,'#3a3b39');rect(lx-6,ly-9,12,12,'#5b534b')}}
function drawKnight(x,y){circle(x+1,y+15,17,'#43584480');rect(x-11,y-8,22,26,'#456cb4');rect(x-8,y-14,16,10,'#d2d9d5');rect(x-6,y-16,12,5,'#a9b9c7');rect(x-7,y-9,14,3,'#343d4c');rect(x-13,y-2,6,14,'#9aaab7');rect(x+8,y-2,6,14,'#9aaab7');rect(x-7,y+17,6,9,'#555b69');rect(x+2,y+17,6,9,'#555b69');rect(x-2,y+2,6,9,'#f0d177');if(p.weapon===0){ctx.strokeStyle='#f6f3dc';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+10,y+4);ctx.lineTo(x+23,y-16);ctx.stroke()}else if(p.weapon===1){ctx.strokeStyle='#c58a48';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x+13,y,12,-1.3,1.3);ctx.stroke()}else{circle(x+18,y-13,6,'#78c8ff');rect(x+13,y-6,3,20,'#986b48')}}
function drawEnemy(e,x,y){circle(x,y+13,e.type?22:15,'#334b3380');if(e.type){rect(x-16,y-11,32,29,e.hit?'#fff6c4':'#567a3b');rect(x-20,y-5,8,22,'#52713d');rect(x+12,y-5,8,22,'#52713d');rect(x-9,y-19,18,12,'#6e9a47');rect(x-5,y-14,4,3,'#f8d47a');rect(x+4,y-14,4,3,'#f8d47a');rect(x-11,y+17,9,10,'#493b30');rect(x+3,y+17,9,10,'#493b30')}else{rect(x-10,y-9,20,23,e.hit?'#f3e9ad':'#65a444');rect(x-9,y-18,18,12,'#7cc04d');rect(x-15,y-15,8,6,'#77a83c');rect(x+7,y-15,8,6,'#77a83c');rect(x-6,y-13,4,3,'#ebf4a4');rect(x+3,y-13,4,3,'#ebf4a4');rect(x-7,y+14,6,8,'#534832');rect(x+2,y+14,6,8,'#534832')}rect(x-(e.type?19:12),y-(e.type?28:25),e.type?38:24,4,'#2a342b');rect(x-(e.type?19:12),y-(e.type?28:25),(e.type?38:24)*Math.max(0,e.hp/e.max),4,'#d96555')}
function draw(){ctx.clearRect(0,0,W,H);drawWorld();let ox=W/2-p.x,oy=H/2-p.y;for(let e of enemies){let x=e.x+ox,y=e.y+oy;if(x>-40&&x<W+40&&y>-40&&y<H+40)drawEnemy(e,x,y)}for(let s of shots){let x=s.x+ox,y=s.y+oy;if(s.kind==='slash'){ctx.strokeStyle='#ffe09b';ctx.lineWidth=8;ctx.beginPath();ctx.arc(x,y,67,s.dir-.85,s.dir+.85);ctx.stroke()}else if(s.kind==='magic'){circle(x,y,9,'#72d2ff');circle(x,y,4,'#fff')}else{ctx.strokeStyle='#fff2c0';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-7,y-5);ctx.lineTo(x+7,y+5);ctx.stroke()}}for(let q of particles)circle(q.x+ox,q.y+oy,3,q.col);drawKnight(W/2,H/2);if(flash>0){ctx.fillStyle='#ff42422c';ctx.fillRect(0,0,W,H)}
// HUD
rect(0,0,W,56,'#142b37e8');ctx.fillStyle='#f7d985';ctx.font='bold 21px system-ui';ctx.fillText('🌅 DAWNRISE',16,31);let bx=Math.min(220,W*.28);rect(bx,12,Math.min(180,W*.2),13,'#443c42');rect(bx,12,Math.min(180,W*.2)*p.hp/p.maxHp,13,'#dd635a');rect(bx,31,Math.min(180,W*.2),7,'#304d6b');rect(bx,31,Math.min(180,W*.2)*p.xp/(p.level*12),7,'#67c5ec');ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.fillText('HP '+Math.ceil(p.hp)+'/'+p.maxHp,bx+4,23);ctx.fillText('LV '+p.level,Math.min(W*.54,bx+200),30);ctx.fillText('TIME '+String(Math.floor(worldTime/60)).padStart(2,'0')+':'+String(Math.floor(worldTime%60)).padStart(2,'0'),Math.min(W*.65,bx+285),30);ctx.fillText('KILLS '+p.kills,Math.min(W*.8,bx+410),30);
let j=joystickCenter();circle(j.x,j.y,68,'#132b3b8c');ctx.strokeStyle='#c4d9d8a0';ctx.lineWidth=3;ctx.beginPath();ctx.arc(j.x,j.y,68,0,Math.PI*2);ctx.stroke();circle(j.x+joyVec.x*48,j.y+joyVec.y*48,27,'#93b4c6a0');rect(W-154,H-70,144,54,'#182d3bcf');ctx.fillStyle='#ffe1a3';ctx.font='bold 14px system-ui';ctx.fillText('WEAPON: '+weapons[p.weapon],W-147,H-47);ctx.fillStyle='#d2e5f0';ctx.font='12px system-ui';ctx.fillText('Tap top-right / Xbox X',W-147,H-27);
if(paused){rect(0,56,W,H-56,'#0c1c27b0');ctx.fillStyle='#ffe1a3';ctx.font='bold 35px system-ui';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2);ctx.textAlign='left'}if(gameOver){rect(0,56,W,H-56,'#08151cce');ctx.textAlign='center';ctx.fillStyle='#ffe4a3';ctx.font='bold 32px system-ui';ctx.fillText('ADVENTURE ENDED',W/2,H/2-20);ctx.font='17px system-ui';ctx.fillText('Goblins defeated: '+p.kills+'   ·   Level '+p.level,W/2,H/2+14);ctx.fillText('Tap anywhere to restart',W/2,H/2+48);ctx.textAlign='left'}}
c.addEventListener('click',()=>{if(gameOver)restart()});let last=performance.now();function loop(t){let dt=Math.min((t-last)/1000,.05);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
